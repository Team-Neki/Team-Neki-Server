# 메모리 H2 를 사용하는 앱에서 명시적으로 import 한다.
spring:
  config:
    activate:
      on-profile: local | test
  datasource:
    url: jdbc:h2:mem:${spring.application.name}db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false
  flyway:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: local
  h2:
    console:
      enabled: true
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:${spring.application.name}testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
