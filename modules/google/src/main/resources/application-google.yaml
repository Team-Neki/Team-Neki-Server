spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
            # 프록시 연결 시에도 인증 요청과 code 교환에 동일한 외부 콜백 주소를 사용한다.
            redirect-uri: ${ADMIN_OAUTH_REDIRECT_URI:http://localhost:8081/api/login/oauth2/code/google}
