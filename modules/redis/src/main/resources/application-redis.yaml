spring:
  data:
    redis:
      port: 6379
      # 미설정 시 Lettuce 기본 60초. 연결된 뒤 Redis 가 죽으면 명령이 이 시간만큼 대기해 Tomcat 스레드가 고갈된다(2026-11 로컬 재현)
      timeout: 500ms
      connect-timeout: 1s
---
spring:
  config:
    activate:
      on-profile: local
  data:
    redis:
      host: localhost
