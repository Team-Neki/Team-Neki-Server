name: Feature Request
description: 새로운 기능을 요청합니다.
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: 구현하고자 하는 기능을 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: 작업 항목을 체크리스트로 작성해주세요.
      value: |
        - [ ]
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: 참고 사항이 있다면 작성해주세요.
    validations:
      required: false
