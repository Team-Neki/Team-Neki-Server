name: Bug Report
description: 버그를 제보합니다.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: 발생한 버그를 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: 버그를 재현하는 단계를 작성해주세요.
      value: |
        1.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: 기대하는 동작을 설명해주세요.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: 참고 사항이 있다면 작성해주세요.
    validations:
      required: false
