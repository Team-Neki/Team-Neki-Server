name: Deploy to Staging (K3s)

on:
  push:
    branches:
      - feat/#7  # 테스트용, 나중에 staging으로 변경
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build-and-deploy:
    name: Build, Test and Deploy to K3s
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(./gradlew properties --no-daemon --console=plain -q | grep "^version:" | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yapp-dev:${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
            ${{ secrets.DOCKER_USERNAME }}/yapp-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to K3s (On-premise)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "🚀 Starting deployment to K3s..."

            # K3s deployment 디렉토리로 이동
            cd /home/yapp/k3s/staging

            # 이미지 태그 업데이트 (deployment.yaml에서 이미지 태그 변경)
            sed -i "s|image: .*yapp-staging:.*|image: ${{ secrets.DOCKER_USERNAME }}/yapp-dev:${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}|g" deployment.yaml

            # K3s에 배포 적용
            kubectl apply -f deployment.yaml

            # 배포 상태 확인
            kubectl rollout status deployment/yapp-staging -n default --timeout=5m

            echo "✅ Deployment completed successfully!"

      - name: Notify deployment result
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to staging succeeded!"
          else
            echo "❌ Deployment to staging failed!"
            exit 1
          fi