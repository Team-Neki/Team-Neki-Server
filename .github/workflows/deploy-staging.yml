name: Deploy to Staging (K3s + GitOps)

on:
  push:
    branches:
      - chore/#171
  workflow_dispatch:  # 수동 실행 가능

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/yapp-dev
  GITOPS_REPO: YAPP-Github/27th-App-Team-2-BE-gitops
  GITOPS_PATH: overlays/staging/deployment.yaml

jobs:
  build-and-deploy:
    name: Build and Deploy via GitOps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon -x test

      # TODO: 테스트 후 삭제 - 배포 실패 알림 테스트용
      - name: Intentional failure for testing
        run: |
          echo "🧪 Testing failure notification..."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(./gradlew properties --no-daemon --console=plain -q | grep "^version:" | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Discord notification - Deployment started
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "🚀 Staging 배포 시작 (GitOps)",
                   "description": "이미지 빌드 완료, GitOps 레포 업데이트 중...",
                   "color": 3447003,
                   "fields": [
                     {
                       "name": "브랜치",
                       "value": "'"${{ github.ref_name }}"'",
                       "inline": true
                     },
                     {
                       "name": "커밋",
                       "value": "'"${{ steps.version.outputs.short_sha }}"'",
                       "inline": true
                     },
                     {
                       "name": "작성자",
                       "value": "'"${{ github.actor }}"'",
                       "inline": true
                     },
                     {
                       "name": "버전",
                       "value": "'"${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}"'",
                       "inline": false
                     },
                     {
                       "name": "커밋 메시지",
                       "value": "'"$(git log -1 --pretty=%B | head -n 1)"'",
                       "inline": false
                     }
                   ],
                   "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

      # ============================================================
      # GitOps: GitOps 레포의 이미지 태그 업데이트
      # ArgoCD가 변경을 감지하여 자동 배포
      # ============================================================
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update image tag in GitOps repo
        run: |
          cd gitops
          NEW_IMAGE="${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}"
          echo "📦 Updating image to: $NEW_IMAGE"

          # deployment.yaml의 이미지 태그 업데이트
          sed -i "s|image: .*yapp-dev:.*|image: $NEW_IMAGE|g" ${{ env.GITOPS_PATH }}

          # 변경사항 확인
          echo "📄 Updated deployment.yaml:"
          grep "image:" ${{ env.GITOPS_PATH }}

      - name: Commit and push to GitOps repo
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "chore(staging): update image to ${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}

          Triggered by: ${{ github.repository }}@${{ github.sha }}
          Author: ${{ github.actor }}"

          git push

      - name: Discord notification - Deployment success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "✅ Staging GitOps 업데이트 완료",
                   "description": "ArgoCD가 자동으로 배포를 진행합니다",
                   "color": 5763719,
                   "fields": [
                     {
                       "name": "브랜치",
                       "value": "'"${{ github.ref_name }}"'",
                       "inline": true
                     },
                     {
                       "name": "커밋",
                       "value": "'"${{ steps.version.outputs.short_sha }}"'",
                       "inline": true
                     },
                     {
                       "name": "작성자",
                       "value": "'"${{ github.actor }}"'",
                       "inline": true
                     },
                     {
                       "name": "배포 버전",
                       "value": "'"${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}"'",
                       "inline": false
                     },
                     {
                       "name": "GitOps 레포",
                       "value": "[27th-App-Team-2-BE-gitops](https://github.com/${{ env.GITOPS_REPO }})",
                       "inline": false
                     }
                   ],
                   "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Discord notification - Deployment failed
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -d '{
                 "embeds": [{
                   "title": "❌ Staging 배포 실패",
                   "description": "빌드 또는 GitOps 업데이트 중 오류 발생",
                   "color": 15158332,
                   "fields": [
                     {
                       "name": "브랜치",
                       "value": "'"${{ github.ref_name }}"'",
                       "inline": true
                     },
                     {
                       "name": "커밋",
                       "value": "'"${{ steps.version.outputs.short_sha }}"'",
                       "inline": true
                     },
                     {
                       "name": "작성자",
                       "value": "'"${{ github.actor }}"'",
                       "inline": true
                     },
                     {
                       "name": "실패 로그",
                       "value": "[GitHub Actions 확인](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                       "inline": false
                     }
                   ],
                   "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
                 }]
               }' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
