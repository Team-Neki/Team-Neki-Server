services:
  db:
    image: postgres:14
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: yapp
    ports:
      - "5432:5432"
    networks:
      - yapp-net
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    restart: always
    environment:
      SERVICES: s3
      DEBUG: 1
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      EXTRA_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:63342,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:63342"
      EXTRA_CORS_ALLOWED_HEADERS: "*"
      EXTRA_CORS_EXPOSE_HEADERS: "ETag,x-amz-server-side-encryption,x-amz-request-id,x-amz-id-2"
    ports:
      - "4566:4566"
    networks:
      - yapp-net
    volumes:
      - ./localstack_data:/var/lib/localstack
      - ./infra/localstack:/etc/localstack/init/ready.d
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  yapp-net:
    name: yapp-net
