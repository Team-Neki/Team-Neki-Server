spring:
  datasource:
    # Testcontainers JDBC URL: 첫 연결 때 docker-compose 와 같은 postgis 이미지를 띄우고 JVM 이 끝나면 지운다.
    # TC_DAEMON 은 컨텍스트가 닫혀 연결이 0 이 돼도 컨테이너를 유지해 캐시된 다른 컨텍스트와 공유하게 한다
    url: jdbc:tc:postgis:14-3.4:///neki?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      # 스키마는 운영과 같이 Flyway 가 만든다
      # Workflow 소유 참조 테이블은 이 저장소의 Flyway 대상이 아니므로 검증하지 않는다.
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false
    open-in-view: false
  flyway:
    enabled: true
    # db/test-migration 은 운영 마이그레이션 사이에 끼워 실행할 테스트 전용 SQL 이다.
    # 버전은 V<앞 운영 버전>_1 형식만 쓰고, 운영(db/migration) 은 정수 버전만 써서 서로 겹치지 않게 한다.
    # 데이터 정리는 여기서 하지 않는다. 매 테스트 전 E2ETestBase 가 전체 테이블을 TRUNCATE 한다
    locations: classpath:db/migration,classpath:db/test-migration
    # postgis 이미지가 public 에 spatial_ref_sys 를 만들어 빈 DB 도 비어 있지 않게 보인다 (baseline-version 0 은 application-postgres.yaml)
    baseline-on-migrate: true

app:
  auth:
    accessTokenSecret: testSecretTokenMustBeVeryLongTestSecretDoesNotUseJasypt
    accessTokenExpiry: 3600000 #1시간
    refreshTokenSecret: testrefreshTokenMustBeVeryLongTestSecretDoesNotUseJasypt
    refreshTokenExpiry: 604800000 #7일


aws:
  s3:
    access-key: test
    secret-key: test
    region: ap-northeast-2
    bucket: yapp-local
