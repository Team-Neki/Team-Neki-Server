spring:
  application:
    name: admin
  profiles:
    default: local
  config:
    import:
      - classpath:application-postgres.yaml
      - classpath:application-jasypt.yaml
      - classpath:application-s3.yaml
      - classpath:application-google.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # apps/api가 migrate하며 admin의 FlywayMigrationStrategy는 validate만 수행한다.
    enabled: true
  session:
    timeout: 30m
    jdbc:
      table-name: ADMIN_SESSION
      initialize-schema: never

# springdoc 2.6.0 의 generic response 처리는 Spring 6.2 에서 NoSuchMethodError 를 낸다 (api 와 같은 우회)
springdoc:
  override-with-generic-response: false

server:
  port: 8081
  servlet:
    session:
      timeout: 30m
      cookie:
        name: ADMINSESSION
        http-only: true
        secure: true
        same-site: lax
        path: /

---
spring:
  config:
    activate:
      on-profile: local
server:
  servlet:
    session:
      cookie:
        secure: false
---
spring:
  config:
    activate:
      on-profile: prod
# 운영 환경에서는 API 스펙을 외부에 노출하지 않는다 (봇/스캐너 탐색 차단)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
