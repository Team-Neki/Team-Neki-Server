spring:
  application:
    name: Neki
  profiles:
    active: local
  config:
    import:
      - classpath:application-postgres.yaml
      - classpath:application-redis.yaml
      - classpath:application-s3.yaml
      - classpath:application-kakao.yaml
      - classpath:application-apple.yaml
      - classpath:application-discord.yaml
      - classpath:application-jasypt.yaml
      - classpath:application-firebase.yaml

logging:
  level:
    org.flywaydb: info

springdoc:
  override-with-generic-response: false

# Application Version (from build.gradle.kts)
app:
  version: "@version@"
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:63342
      - http://127.0.0.1:63342
      - https://dev-yapp-admin.suitestudy.com
      - https://yapp-admin.suitestudy.com/

# Spring Boot Actuator 설정 (Health Check for Kubernetes)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: neki


aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY:}
    secret-key: ${AWS_S3_SECRET_KEY:}
    bucket: ${AWS_S3_BUCKET:}
    base-url: ${AWS_S3_BASE_URL:}
